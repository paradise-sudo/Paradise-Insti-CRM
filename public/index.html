function wireSplits(){
  const decide = async (id, status) => {
    const x = (S.splits || []).find(s => s.id === id);
    if (!x) return;
    const el = $(`[data-pct="${id}"]`);
    const pct = Math.max(0, Math.min(100, Number(digits(el ? el.value : '50')))) / 100;
    try {
      await updateDoc(doc(db, 'creditSplits', id), {
        status, pct, decidedBy: S.me.id, decidedAt: stamp(today())
      });
      if (status === 'approved') await backfillSplit(x, pct);
      S.splitFlash = status === 'approved'
        ? `${userName(x.requestedBy)} keeps ${Math.round(pct*100)}% on `
          + `${x.accountName || accName(x.accountId)}; `
          + `${userName(x.owner)} takes the rest.`
        : 'Declined. It all stays with whoever booked it.';
      // The listener repaints Admin the moment this write lands, so the
      // message is held in state and re-rendered rather than shouted at a
      // DOM node that is about to be replaced.
      msg('splitMsg', S.splitFlash, 'ok');
    } catch (e) {
      S.splitFlash = null;
      msg('splitMsg', friendly(e, 'Could not save that.'));
    }
  };

  $('#view').querySelectorAll('[data-ok]').forEach(b =>
    b.onclick = () => decide(b.dataset.ok, 'approved'));
  $('#view').querySelectorAll('[data-no]').forEach(b =>
    b.onclick = () => decide(b.dataset.no, 'declined'));
  $('#view').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const x = (S.splits || []).find(s => s.id === b.dataset.edit);
    if (!x) return;
    modal('Change the split', `
      <p class="sm muted">${esc(x.accountName || accName(x.accountId))}</p>
      <label for="np">% to ${esc(userName(x.requestedBy))}</label>
      <input id="np" class="fld" inputmode="numeric"
             value="${Math.round((x.pct||0)*100)}">
      <p class="hint">Applies to orders booked from now on. Earlier orders keep
        the split they were booked under.</p>`,
      m => async () => {
        const pct = Math.max(0, Math.min(100,
          Number(digits(m.querySelector('#np').value)))) / 100;
        await updateDoc(doc(db, 'creditSplits', x.id),
          { pct, decidedBy: S.me.id, decidedAt: stamp(today()) });
      });
  });
}

/* The order that raised the request was booked before anyone had decided, so
   it went in whole to the person who booked it. Approving settles it. */
async function backfillSplit(x, pct){
  const mine = S.orders.filter(o => o.accountId === x.accountId
    && o.bookedBy === x.requestedBy && o.creditPending);
  if (!mine.length) return;
  const batch = writeBatch(db);
  mine.forEach(o => batch.update(doc(db, 'orders', o.id), {
    creditSplit: { [x.requestedBy]: pct, [x.owner]: round4(1 - pct) },
    creditPending: false, updatedBy: S.me.id
  }));
  await batch.commit();
}

/* ---- reporting tree ------------------------------------------------------
   A manager's numbers are their own plus everyone under them, at any depth.
   That roll-up is what makes "reports to" a target decision and not just an
   org chart: park a rep under someone and their target lands in that
   person's headline figure.                                                */

/* Cycle-safe on purpose. Two people set to report to each other would send
   the old plain recursion into a stack overflow and take the whole app down
   on the next render, which is a high price for a mis-click. */
function teamOf(id){
  const out = [id], seen = new Set([id]);
  const walk = p => S.users.filter(u => u.managerId === p).forEach(u => {
    if (seen.has(u.id)) return;
    seen.add(u.id); out.push(u.id); walk(u.id);
  });
  walk(id);
  return out;
}

/* Would setting `mgr` as uid's manager close a loop? Walk up from mgr; if we
   arrive back at uid, it would. */
function wouldCycle(uid, mgr){
  let at = mgr, hops = 0;
  while (at && hops++ < 50) {
    if (at === uid) return true;
    const u = S.users.find(x => x.id === at);
    at = u ? u.managerId : null;
  }
  return false;
}

const FY_FROM = '2026-04-01', FY_TO = '2027-03-31';

function adminTree(){
  const me = S.me.id;
  const users = S.users.slice().sort((a,b) =>
    (a.role === 'admin' ? 1 : 0) - (b.role === 'admin' ? 1 : 0)
    || String(a.name).localeCompare(String(b.name)));

  const row = u => {
    const team = teamOf(u.id);
    const reportees = team.filter(x => x !== u.id);
    const own  = targetForRange(FY_FROM, FY_TO, [u.id]);
    const roll = targetForRange(FY_FROM, FY_TO, team);
    const others = users.filter(x => x.id !== u.id && !wouldCycle(u.id, x.id));
    return { c: [
      `<div style="font-weight:600">${esc(u.name)}</div>
       <div class="sm muted">${esc(u.email || '')}</div>`,
      `<select class="fld" data-mgr="${u.id}" style="margin:0;min-width:140px;
         text-align:left">
         <option value="">— nobody (top level) —</option>
         ${others.map(x => `<option value="${x.id}"${
           u.managerId === x.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}
       </select>`,
      reportees.length
        ? `<span class="sm">${esc(reportees.map(userName).join(', '))}</span>`
        : '<span class="muted">—</span>',
      `<select class="fld" data-role="${u.id}" style="margin:0;min-width:110px"${
         u.id === me ? ' disabled title="You cannot change your own role"' : ''}>
         ${['rep','manager','admin'].map(r => `<option value="${r}"${
           u.role === r ? ' selected' : ''}>${r}</option>`).join('')}
       </select>`,
      own ? inr(own) : '—',
      roll > own ? `<b>${inr(roll)}</b>
        <span class="sm muted">(${team.length})</span>` : (own ? inr(own) : '—')
    ] };
  };

  return `
    <div class="card">
      <h2>Who reports to whom</h2>
      <p class="sm muted" style="margin:-4px 0 12px">A manager's dashboard shows
        their own numbers <b>plus everyone under them</b>, at any depth. So this
        is a target decision, not just an org chart — move a rep here and
        their target moves into that manager's headline figure.</p>
      ${dtable(['Person','Reports to','Reportees','Role','Own FY27','Rolled up'],
               users.map(row))}
      <p id="treeMsg" class="msg"></p>
      <p class="hint" style="margin-top:10px">Saved as soon as you change one.
        A loop is refused — two people reporting to each other would take
        the app down. Own FY27 is that person's own targets for Apr-26 to
        Mar-27; Rolled up adds their team's.</p>
    </div>`;
}

function wireTree(){
  const save = async (uid, patch, what) => {
    try {
      await updateDoc(doc(db, 'users', uid), { ...patch, updatedBy: S.me.id });
      const u = S.users.find(x => x.id === uid);
      if (u) Object.assign(u, patch);
      if (S.byId[uid]) Object.assign(S.byId[uid], patch);
      msg('treeMsg', what, 'ok');
      viewAdmin();
      setTimeout(() => msg('treeMsg', what, 'ok'), 0);
    } catch (e) {
      msg('treeMsg', friendly(e, 'Could not save that.'));
    }
  };

  $('#view').querySelectorAll('[data-mgr]').forEach(sel => sel.onchange = () => {
    const uid = sel.dataset.mgr, mgr = sel.value || null;
    if (mgr && wouldCycle(uid, mgr)) {
      msg('treeMsg', userName(mgr) + ' already reports up through '
        + userName(uid) + ', so that would be a loop.');
      viewAdmin();
      return;
    }
    save(uid, { managerId: mgr },
      userName(uid) + (mgr ? ' now reports to ' + userName(mgr)
                           : ' no longer reports to anyone')
      + '. Their target rolls up accordingly.');
  });

  $('#view').querySelectorAll('[data-role]').forEach(sel => sel.onchange = () => {
    const uid = sel.dataset.role;
    save(uid, { role: sel.value }, userName(uid) + ' is now a ' + sel.value + '.');
  });
}

function viewAdmin() {
  const reps = S.users.filter(u => u.active !== false && u.role !== 'admin');
  const sel = S.adminRep || (reps[0] && reps[0].id);
  S.adminRep = sel;

  $('#view').innerHTML = `
    <div class="card">
      <h2>Targets</h2>
      <div class="row" style="margin-bottom:12px">
        <div><label for="arep">Whose targets</label>
          <select id="arep" class="fld">
            ${reps.map(u => `<option value="${u.id}"${u.id===sel?' selected':''}>
              ${esc(u.name)}</option>`).join('')}
          </select></div>
        <div><label for="afy">Financial year</label>
          <select id="afy" class="fld">
            <option value="2026">FY27 · Apr-26 to Mar-27</option>
            <option value="2025">FY26 · Apr-25 to Mar-26</option>
          </select></div>
      </div>
      <div id="tgtBody"></div>
    </div>`;

  const draw = () => {
    const uid = $('#arep').value, fy = +$('#afy').value;
    const months = fyMonths(fy);
    const cur = {};
    S.targets.filter(t => t.scope === 'rep' && t.userId === uid)
      .forEach(t => { (cur[t.month] = cur[t.month] || {})[t.bucket] = t.amount; });

    $('#tgtBody').innerHTML = `
      <p class="hint">Type the overall figure and the split follows at
        45 / 55, which is how every month in the workbook is set. Override
        either side if you need to.</p>
      <div class="tgrid">
        <div class="th">Month</div><div class="th">Overall</div>
        <div class="th">New</div><div class="th">Old</div>
        ${months.map(m => {
          const c = cur[m] || {};
          return `<div class="tm">${monthLabel(m)}</div>
            <div><input class="fld tin" data-m="${m}" data-b="overall" inputmode="numeric"
              value="${c.overall ? Math.round(c.overall) : ''}" placeholder="0"></div>
            <div><input class="fld tin" data-m="${m}" data-b="new" inputmode="numeric"
              value="${c.new ? Math.round(c.new) : ''}" placeholder="0"></div>
            <div><input class="fld tin" data-m="${m}" data-b="old" inputmode="numeric"
              value="${c.old ? Math.round(c.old) : ''}" placeholder="0"></div>`;
        }).join('')}
      </div>
      <div class="row" style="margin-top:14px;align-items:center">
        <div class="sm"><b id="tgtSum">—</b> <span class="muted">for the year</span></div>
        <div style="flex:0 0 auto"><button class="btn" id="tgtSave"
          style="width:auto;padding:10px 18px">Save targets</button></div>
      </div>
      <p id="tgtMsg" class="msg"></p>`;

    const inputs = () => [...$('#tgtBody').querySelectorAll('.tin')];
    const retotal = () => {
      const n = inputs().filter(i => i.dataset.b === 'overall')
        .reduce((a, i) => a + (Number(digits(i.value)) || 0), 0);
      $('#tgtSum').textContent = inr(n);
    };

    inputs().forEach(i => {
      i.oninput = () => {
        if (i.dataset.b === 'overall') {
          const v = Number(digits(i.value)) || 0;
          const row = inputs().filter(x => x.dataset.m === i.dataset.m);
          const nw = row.find(x => x.dataset.b === 'new');
          const od = row.find(x => x.dataset.b === 'old');
          // Rounded so the two halves always add back to the whole.
          if (nw) nw.value = v ? Math.round(v * NEW_SHARE) : '';
          if (od) od.value = v ? v - Math.round(v * NEW_SHARE) : '';
        }
        retotal();
      };
    });
    retotal();

    $('#tgtSave').onclick = async () => {
      const b = $('#tgtSave');
      const rows = [];
      months.forEach(m => {
        ['overall','new','old'].forEach(bucket => {
          const el = inputs().find(x => x.dataset.m === m && x.dataset.b === bucket);
          rows.push({ m, bucket, amount: Number(digits(el.value)) || 0 });
        });
      });
      // A month whose halves do not add up is almost always a typo, and it
      // would quietly skew that person's incentive gates for the year.
      const bad = months.filter(m => {
        const g = k => rows.find(r => r.m === m && r.bucket === k).amount;
        return g('overall') && Math.abs(g('new') + g('old') - g('overall')) > 2;
      });
      if (bad.length) {
        msg('tgtMsg', 'New and old do not add up to overall in '
          + bad.map(monthLabel).join(', ') + '. Fix those before saving.');
        return;
      }

      busy(b, 'Saving…');
      try {
        const batch = writeBatch(db);
        rows.forEach(r => {
          const id = `tgt_${uid}_${r.m}_${r.bucket}`;
          batch.set(doc(db, 'targets', id), {
            userId: uid, month: r.m, bucket: r.bucket,
            amount: r.amount, scope: 'rep', accountName: null,
            updatedAt: serverTimestamp(), updatedBy: S.me.id
          }, { merge: true });
        });
        await batch.commit();

        // keep the local copy honest so the dashboard reflects it at once
        rows.forEach(r => {
          const id = `tgt_${uid}_${r.m}_${r.bucket}`;
          const ex = S.targets.find(t => t.id === id);
          if (ex) ex.amount = r.amount;
          else S.targets.push({ id, userId: uid, month: r.m, bucket: r.bucket,
                                amount: r.amount, scope: 'rep', accountName: null });
        });
        msg('tgtMsg', 'Saved. The dashboard uses these straight away.', 'ok');
      } catch (e) {
        msg('tgtMsg', friendly(e, 'Could not save the targets.'));
      } finally { done(b); }
    };
  };

  $('#arep').onchange = draw;
  $('#afy').onchange = draw;
  draw();

  $('#view').insertAdjacentHTML('beforeend', adminSplits());
  wireSplits();
  $('#view').insertAdjacentHTML('beforeend', adminTree());
  wireTree();
}

/* ======================================================== SHARED LIST BITS
   Five of the six screens below are the same shape: filter a list, show it,
   tap a row to open that account in Log activity - which is the only place a
   deal can actually be moved. Written once here rather than five times.   */

/* A deal counts as yours if you own it OR you handed it over. Anushikha owns
   every C1/C2 handoff, so without the second clause a rep's own pipeline
   emptied the moment they followed the process. */
const oursDeal = (o, uids) =>
  uids.includes(o.owner) || (o.handedFrom && uids.includes(o.handedFrom));
const openDeals = uids => S.opps.filter(o => o.stage < CLOSED && oursDeal(o, uids));
const accName   = id => (S.byId[id] || {}).name || 'Account';
const daysIn    = o => { const d = parseDate(o.stageSince); return d ? dayspan(d, today()) : null; };
const stageTag  = i => `<span class="tag" style="background:var(${STAGES[i].v})">${STAGES[i].k}</span>`;
const TODAY     = () => iso(today());

function openAccount(accId){ closeModal(); go('log'); setTimeout(() => pick(accId), 60); }
function wireRows(root){
  (root || $('#view')).querySelectorAll('[data-go]').forEach(el =>
    el.onclick = () => openAccount(el.dataset.go));
}

/* A capped list. 469 open deals is more than anyone reads; the cap keeps the
   first paint quick and the button is there when someone means it. */
function capped(rows, render, cap){
  cap = cap || 120;
  const head = rows.slice(0, cap).map(render).join('');
  return `<div class="list">${head}</div>` + (rows.length > cap
    ? `<button class="btn sec" id="moreBtn" style="width:auto;padding:9px 14px;
         margin-top:10px">Show the remaining ${rows.length - cap}</button>` : '');
}
function wireMore(rows, render, cap){
  const b = $('#moreBtn');
  if (!b) return;
  b.onclick = () => {
    b.previousElementSibling.innerHTML = rows.map(render).join('');
    b.remove();
    wireRows();
  };
}

function dealRow(o){
  const na  = o.nextActionDate ? iso(parseDate(o.nextActionDate)) : null;
  const age = daysIn(o);
  const late = na && na < TODAY();
  const handed = o.handedFrom && o.owner !== o.handedFrom;
  return `<div class="it" data-go="${o.accountId}">
    ${stageTag(o.stage)}
    <span class="nm">${esc(accName(o.accountId))}${handed
      ? ` <span class="sm muted">→ ${esc(userName(o.owner))}</span>` : ''}</span>
    <span class="meta">${inr(o.expectedValue || 0)}
      · ${age == null ? '—' : age + 'd'}
      · ${na ? (late ? `<span class="req">${esc(na)}</span>` : esc(na))
             : `<span class="req">${ab('NA')}</span>`}</span>
  </div>`;
}

/* ================================================================ PIPELINE
   Every open deal, one screen. The dashboard funnel answers "how much is in
   C2"; this answers "which ones, and which have gone quiet".            */
function viewPipeline(){
  const uids = repFilterIds();
  const all  = openDeals(uids);
  if (S.pipeStage == null) S.pipeStage = -1;
  S.pipeSort = S.pipeSort || 'value';

  const q = norm(S.pipeQ || '');
  let rows = all;
  if (S.pipeStage >= 0) rows = rows.filter(o => o.stage === S.pipeStage);
  if (q) rows = rows.filter(o => norm(accName(o.accountId)).includes(q));

  const sorters = {
    value: (a,b) => (b.expectedValue||0) - (a.expectedValue||0),

let _t;
function debounce(fn, ms){ return (...a) => { clearTimeout(_t); _t = setTimeout(()=>fn(...a), ms); }; }

/* ============================================================== EXCEPTIONS
   The screen that earns its keep: everything that is wrong right now, with
   the worst first. Each check is one question a manager would otherwise ask
   in the morning meeting.

   History is exempt from the paperwork checks. 1,852 of the 2,111 imported
   orders have no invoice number because the workbook never carried one -
   flagging those would bury the 248 from this year that are genuinely
   missing and fixable.                                                    */

const SLA = [3, 5, 5, 4, 7];        // days per stage, matches DEFAULT_CONFIG
const FY_START = () => {
  const t = today();
  return (t.getMonth() >= 3 ? t.getFullYear() : t.getFullYear()-1) + '-04-01';
};

function exceptionSets(uids){
  const open = openDeals(uids);
  const td   = TODAY();
  const fy   = FY_START();
  const mine = o => !o.bookedBy || uids.includes(o.bookedBy);
  const fyOrders = S.orders.filter(o => o.orderDate >= fy && mine(o));

  // Split on purpose. A flat "past its SLA" check flagged 456 of 469 open
  // deals, because the workbook's stage dates go back to 2023 - a list that
  // long is a list nobody opens. Past the SLA but touched this quarter is a
  // nudge; open for over a year is a different job, done in one sitting.
  const stalled = open.filter(o => {
    const d = daysIn(o);
    return d != null && d > (SLA[o.stage] || 7) && d <= 120;
  }).sort((a,b) => (daysIn(b)||0) - (daysIn(a)||0));

  const ancient = open.filter(o => {
    const d = daysIn(o);
    return d != null && d > 365;
  }).sort((a,b) => (b.expectedValue||0) - (a.expectedValue||0));

  const noNext = open.filter(o => !o.nextActionDate)
    .sort((a,b) => (b.expectedValue||0) - (a.expectedValue||0));

  const overdue = open.filter(o => o.nextActionDate
      && iso(parseDate(o.nextActionDate)) < td)
    .sort((a,b) => String(a.nextActionDate).localeCompare(String(b.nextActionDate)));

  const noInvoice = fyOrders.filter(o => !o.invoiceNumber)
    .sort((a,b) => (b.value||0) - (a.value||0));
  const noStore   = fyOrders.filter(o => !o.store)
    .sort((a,b) => (b.value||0) - (a.value||0));
  const noRep     = S.orders.filter(o => o.orderDate >= fy && !o.bookedBy)
    .sort((a,b) => (b.value||0) - (a.value||0));

  // A confirmed deal is a promise with a date on it. Past the date and still
  // not closed is the single most recoverable number on this screen.
  const slipped = open.filter(o => o.stage === 4 && o.expectedOrderDate
      && iso(parseDate(o.expectedOrderDate)) < td)
    .sort((a,b) => (b.expectedValue||0) - (a.expectedValue||0));

  return [
    { k:'slipped', t:'Confirmed but not closed', rows:slipped, kind:'deal',
      why:'C3 with an expected order date that has passed. Either the order '
        + 'was raised and not logged, or it is slipping.' },
    { k:'overdue', t:'Next action overdue', rows:overdue, kind:'deal',
      why:'The date the rep set for themselves has gone by.' },
    { k:'stalled', t:'Past its stage SLA', rows:stalled, kind:'deal',
      why:'Moved within the last four months but has now sat too long: '
        + SLA.slice(0,5).map((d,i) => STAGES[i].k + ' ' + d + 'd').join(', ') + '.' },
    { k:'ancient', t:'Open for over a year', rows:ancient, kind:'deal',
      why:'Has not moved stage in 365 days. Most of these came in from the '
        + 'workbook and should be cancelled with a reason or genuinely revived '
        + '— either way they are inflating the pipeline.' },
    { k:'noNext', t:'No next action at all', rows:noNext, kind:'deal',
      why:'An open deal with nothing scheduled is a deal nobody is working.' },
    { k:'noInvoice', t:'This year’s orders with no invoice number',
      rows:noInvoice, kind:'order',
      why:'Finance cannot match the payment without it. History is excluded '
        + '— the workbook never carried invoice numbers.' },
    { k:'noStore', t:'This year’s orders with no store', rows:noStore, kind:'order',
      why:'Which kitchen punched it. Needed to settle the store’s own books.' },
    { k:'noRep', t:'Orders with no rep', rows:noRep, kind:'order',
      why:'Counts toward nobody’s target and nobody’s incentive.' }
  ];
}

/* ========================================================= DATA & IMPORTS
   Three jobs on one screen:

   1. Say what is in here and what the import had to clean, because a number
      nobody can trace is a number nobody trusts.
   2. Take data IN. Contact numbers above all: the DCR carried a SPOC Number
      column and it is empty on all 4,439 rows, so search-by-number has
      nothing to search until somebody fills it. Anushikha's Apollo and
      LinkedIn exports go in here, and cold lists land in `prospects` rather
      than the pipeline so 500 names cannot crater the conversion rate.
   3. Get data OUT properly - chosen range, chosen columns, Excel or CSV.

   Re-importing the DCR itself is deliberately NOT here. That parse has
   thirteen cleaning rules behind it and lives in seed/build_seed.py where it
   can be read and argued with; a browser button that silently half-does it
   is how a CRM ends up with two Deloittes.                                */

/* ---- CSV out ------------------------------------------------------------ */
function csv(rows, cols){
  const q = v => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return cols.map(c => q(c.t)).join(',') + '\n'
    + rows.map(r => cols.map(c => q(c.f(r))).join(',')).join('\n');
}
function download(name, text, type){
  const b = new Blob([text], { type: type || 'text/csv;charset=utf-8' });
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}

/* ---- SheetJS, loaded only if someone actually asks for Excel ----------- */
let xlsxReady = null;
function needXlsx(){
  if (xlsxReady) return xlsxReady;
  xlsxReady = new Promise((res, rej) => {
    if (window.XLSX) return res(window.XLSX);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload  = () => res(window.XLSX);
    s.onerror = () => rej(new Error('Could not load the Excel library. '
      + 'Check the connection, or use CSV.'));
    document.head.appendChild(s);
  });
  return xlsxReady;
}

/* A CSV parser that survives quoted commas and embedded newlines, because
   every real contact list has a company with a comma in its name. */
function parseCsv(text){
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

async function readSheet(file){
  const name = file.name.toLowerCase();
  if (name.endsWith('.csv') || name.endsWith('.txt')) {
    return parseCsv(await file.text());
  }
  const X = await needXlsx();
  const wb = X.read(await file.arrayBuffer(), { type:'array', cellDates:true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return X.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' })
    .filter(r => r.some(x => String(x).trim() !== ''));
}

function downloadXlsx(name, sheets){          // sheets: [{name, rows:[[...]]}]
  return needXlsx().then(X => {
    const wb = X.utils.book_new();
    sheets.forEach(s => X.utils.book_append_sheet(wb,
      X.utils.aoa_to_sheet(s.rows), s.name.slice(0, 31)));
    X.writeFile(wb, name);
  });
}

/* Guess the mapping from the header row. Deliberately generous - the whole
   point is that Ayush does not rename columns before uploading. */
function guessMap(headers, cols){
  const norm2 = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const ALIAS = {
    account:['account','acname','acname','accountname','company','client',
             'companyname','organisation','organization'],
    company:['company','companyname','account','accountname','organisation',
             'organization','client'],
    name:['name','contactname','spoc','spocname','person','fullname',
          'firstname','contact'],
    phone:['phone','mobile','number','spocnumber','contactnumber','phonenumber',
           'mobilenumber','cell','whatsapp'],
    email:['email','emailaddress','mail','workemail'],
    designation:['designation','title','jobtitle','role','position'],
    isPrimary:['primary','isprimary','main'],
    notes:['notes','remarks','comment','comments'],
    region:['region','city','location','branch'],
    industry:['industry','sector','vertical','type'],
    source:['source','channel','listsource','origin']
  };
  const out = {};
  cols.forEach(c => {
    const want = ALIAS[c.k] || [c.k];
    let hit = -1;
    headers.forEach((h, i) => {
      if (hit >= 0) return;
      const n = norm2(h);
      if (!n) return;
      if (want.includes(n)) hit = i;
    });
    if (hit < 0) headers.forEach((h, i) => {       // looser second pass
      if (hit >= 0) return;
      const n = norm2(h);
      if (n && want.some(w => n.includes(w) || w.includes(n))) hit = i;
    });
    out[c.k] = hit;
  });
  return out;
}

/* Turn the grid into records, and say honestly which ones cannot be written. */
function buildRecords(){
  const spec = UPLOADS[S.upKind];
  const { body, map } = S.upGrid;
  const at = i => r => (map[i] >= 0 ? String(r[map[i]] == null ? '' : r[map[i]]).trim() : '');

  const byName = {};
  S.accounts.forEach(a => { byName[a.nameNormalised || norm(a.name)] = a; });

  const ok = [], bad = [];
  body.forEach((r, n) => {
    const get = k => at(k)(r);
    const rec = {};
    spec.cols.forEach(c => rec[c.k] = get(c.k));
    const missing = spec.cols.filter(c => c.req && !rec[c.k]).map(c => c.t);
    if (missing.length) {
      bad.push({ row:n+2, why:'missing ' + missing.join(', '), rec });
      return;
    }
    if (S.upKind === 'contacts') {
      const a = byName[norm(rec.account)];
      if (!a) {
        bad.push({ row:n+2, why:'no account called "' + rec.account + '"', rec });
        return;
      }
      rec.accountId = a.id; rec.accountName = a.name;
    } else {
      const a = byName[norm(rec.company)];
      rec.accountId = a ? a.id : null;
      rec.existing = !!a;
    }
    const ph = digits(rec.phone);
    if (rec.phone && ph.length < 10) {
      bad.push({ row:n+2, why:'phone "' + rec.phone + '" is not 10 digits', rec });
      return;
    }
    rec.phone = ph;
    ok.push(rec);
  });

  // a number already on the same account is not a new contact
  const seen = new Set(S.contacts.map(c => c.accountId + '|' + (c.phoneNormalised||c.phone||'')));
  const dupe = [];
  const fresh = ok.filter(r => {
    const k = (r.accountId||'') + '|' + (r.phone||'');
    if (r.phone && seen.has(k)) { dupe.push(r); return false; }
    seen.add(k);
    return true;
  });
  return { fresh, dupe, bad };
}

      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">

    ...UPLOADS[S.upKind].cols.map(c => ({ t:c.t, f:b => b.rec[c.k] }))
  ]));

  $('#upGo').onclick = async () => {
    const b = $('#upGo'); busy(b, 'Writing…');
    try {

      $('#upfile').value = '';

async function writeUpload(recs){
  const isContact = S.upKind === 'contacts';
  const col = isContact ? 'contacts' : 'prospects';
  for (let i = 0; i < recs.length; i += 400) {      // Firestore caps at 500
    const batch = writeBatch(db);
    recs.slice(i, i + 400).forEach(r => {
      const base = { createdAt: serverTimestamp(), createdBy: S.me.id,
                     updatedBy: S.me.id };
      batch.set(doc(collection(db, col)), isContact ? {
        ...base, accountId: r.accountId, name: r.name,
        phone: r.phone || '', phoneNormalised: r.phone || '',
        email: r.email || '', designation: r.designation || '',
        isPrimary: /^(y|yes|true|1)$/i.test(r.isPrimary || ''),
        notes: r.notes || ''
      } : {
        ...base, company: r.company, accountId: r.accountId || null,
        name: r.name || '', phone: r.phone || '',
        phoneNormalised: r.phone || '', email: r.email || '',
        designation: r.designation || '', region: r.region || '',
        industry: r.industry || '', source: r.source || 'upload',
        status: 'new', owner: null
      });
    });
    await batch.commit();
  }
  // keep the local copy honest so the counts move without a reload
  if (isContact) recs.forEach(r => S.contacts.push({
    id: 'local_' + Math.random().toString(36).slice(2),
    accountId: r.accountId, name: r.name, phone: r.phone || '',
    phoneNormalised: r.phone || '', email: r.email || '',
    designation: r.designation || '', isPrimary: false
  }));
}

function exportRows(set, uids, from, to){
  const inRange = d => {
    const s = String(d || '').slice(0,10);
    return s && s >= from && s <= to;
  };
  switch (set) {
    case 'orders':   return S.orders
      .filter(o => (!o.bookedBy || uids.includes(o.bookedBy)) && inRange(o.orderDate));
    case 'pipeline': return openDeals(uids);
    case 'accounts': return S.accounts.filter(a => uids.includes(a.owner));
    case 'contacts': return S.contacts.filter(c => {
      const a = S.byId[c.accountId]; return a && uids.includes(a.owner); });
    case 'activities': return (S.acts || [])
      .filter(a => uids.includes(a.loggedBy) && inRange(a.loggedAt));
    case 'targets':  return S.targets
      .filter(t => t.scope !== 'rep' || uids.includes(t.userId));
    case 'history': {
      const actBy = {}, ordBy = {}, valBy = {}, lastBy = {}, mvBy = {};
      (S.acts || []).forEach(a => {
        actBy[a.accountId] = (actBy[a.accountId]||0) + 1;
        const d = String(a.loggedAt||'').slice(0,10);
        if (d && (!lastBy[a.accountId] || d > lastBy[a.accountId]))
          lastBy[a.accountId] = d;
      });
      S.orders.forEach(o => {
        ordBy[o.accountId] = (ordBy[o.accountId]||0) + 1;
        valBy[o.accountId] = (valBy[o.accountId]||0) + (o.value||0);
      });
      const oppAcc = {}; S.opps.forEach(o => oppAcc[o.id] = o.accountId);
      (S.hist || []).forEach(h => {
        const a = oppAcc[h.opportunityId]; if (!a) return;
        mvBy[a] = (mvBy[a]||0) + 1;
      });
      return S.accounts.filter(a => uids.includes(a.owner))
        .map(a => ({ name:a.name, owner:a.owner, contacts:actBy[a.id]||0,
                     moves:mvBy[a.id]||0, orders:ordBy[a.id]||0,
                     value:valBy[a.id]||0, last:lastBy[a.id]||null }))
        .filter(r => r.contacts || r.orders || r.moves);
    }
  }
  return [];
}

function wireExport(uids){
  const drawCols = () => {
    const set = $('#exSet').value;
    const spec = EX_SETS[set];
    $('#exRange').style.display = spec.dated ? '' : 'none';
    S.exOff = S.exOff || {};
    $('#exCols').innerHTML = spec.cols.map(([t]) =>
      `<button class="chip${(S.exOff[set]||[]).includes(t) ? '' : ' on'}"
        data-col="${esc(t)}">${esc(t)}</button>`).join('');
    $('#exCols').querySelectorAll('[data-col]').forEach(b => b.onclick = () => {
      const off = S.exOff[set] = S.exOff[set] || [];
      const t = b.dataset.col;
      const i = off.indexOf(t);
      if (i >= 0) off.splice(i, 1); else off.push(t);
      drawCols();
    });
  };
  $('#exSet').onchange = drawCols;
  drawCols();

  $('#exGo').onclick = async () => {
    const set = $('#exSet').value, fmt = $('#exFmt').value;
    const spec = EX_SETS[set];
    const from = $('#exFrom').value, to = $('#exTo').value;
    const off = S.exOff[set] || [];
    const cols = spec.cols.filter(([t]) => !off.includes(t));
    if (!cols.length) return msg('exMsg', 'Pick at least one column.');

    const b = $('#exGo'); busy(b, 'Building…');
    msg('exMsg', '');
    try {
      if ((set === 'activities' || set === 'history') && !S.histReady) {
        msg('exMsg', 'Fetching activities first…', 'ok');
        await loadHistory();
      }
      const rows = exportRows(set, uids, from, to);
      if (!rows.length) { msg('exMsg', 'Nothing matches that.'); return; }

      const name = 'paradise-' + set + '-' + iso(today());
      if (fmt === 'csv') {
        download(name + '.csv', csv(rows, cols.map(([t,f]) => ({ t, f }))));
      } else {
        await downloadXlsx(name + '.xlsx', [
          { name: set, rows: [cols.map(c => c[0])]
              .concat(rows.map(r => cols.map(([,f]) => f(r)))) },
          { name: 'About', rows: [
            ['Exported', new Date().toLocaleString('en-IN')],
            ['By', S.me.name || S.me.email],
            ['Rows', rows.length],
            ['Reps', S.reps.length ? uids.map(userName).join(', ') : 'all reps'],
            ['Range', spec.dated ? from + ' to ' + to : 'not date-filtered'],
            ['Source', 'Paradise Institutional Sales CRM']] }
        ]);
      }
      msg('exMsg', rows.length.toLocaleString('en-IN') + ' rows downloaded.', 'ok');
    } catch (e) {
      msg('exMsg', e.message || 'Could not build that file.');
    } finally { done(b); }
  };
}

/* =============================================================== INCENTIVE
   The arithmetic lives in the calculateIncentive Cloud Function, not here,
   so that one set of rules serves the screen, the monthly mail and any later
   payroll export. This screen shows the result and nothing more.

   New : revenue x 1.7% x min(achievement, 120%), only at 80% or above

  const months = [];

        <div><label for="im">Month</label>

      </div>

        gated at 80%. Old ${'×'} 1.0%, gated at 99%. MSN ${'×'} 0.3% flat.
        Each bucket stands on its own target; there is no overall gate.</p>
      <p id="imsg" class="msg"></p>
    </div>
    <div id="ibody"></div>`;

/* ========================================================= CLIENT HISTORY
   Everything that has happened to one client, in order: how often they were
   contacted, every time the deal moved from one stage to another, and every
   time it converted into an order.

   Activities and stage history are 7,000 documents between them and nothing
   else in the app needs either, so they are fetched the first time this
   screen is opened rather than at sign-in. After that they stay in memory.

   Two rows are deliberately ignored. A stage row with no fromStage is a deal
   being created, not moving - the first import wrote 2,012 of those, dated
   the day of the load. And history that predates the current FY still shows,
   because "when did this client last actually move" is the question the
   workbook could never answer.                                            */

/* Activities and stage history are live listeners attached at boot, so this
   no longer fetches anything - it just waits for the first snapshot to land.
   Kept because two screens ask "is the history here yet" and one of them
   wants to await it. */
function loadHistory(){
  if (S.histReady && S.hist) return Promise.resolve();
  return new Promise((res, rej) => {
    let waited = 0;
    const t = setInterval(() => {
      if (S.histReady && S.hist) { clearInterval(t); res(); }
      else if ((waited += 200) > 30000) {
        clearInterval(t);
        rej(new Error('The history did not arrive. Check the connection.'));
      }
    }, 200);
  });
}

const monthOf = v => { const d = parseDate(v); return d ? iso(d).slice(0, 7) : null; };

/* Everything known about one account, keyed by month. */
function clientHistory(accId){
  const oppIds = new Set(S.opps.filter(o => o.accountId === accId).map(o => o.id));
  const acts = (S.acts || []).filter(a => a.accountId === accId);
  const moves = (S.hist || []).filter(h => oppIds.has(h.opportunityId));
  const ords = S.orders.filter(o => o.accountId === accId);

  const months = {};
  const bump = (mk, k, n) => {
    if (!mk) return;
    months[mk] = months[mk] || { mk, contacts:0, moves:0, orders:0, value:0, won:0 };
    months[mk][k] += (n == null ? 1 : n);
  };
  acts.forEach(a => bump(monthOf(a.loggedAt), 'contacts'));
  moves.forEach(h => { bump(monthOf(h.changedAt), 'moves');
                       if (h.toStage === CLOSED) bump(monthOf(h.changedAt), 'won'); });
  ords.forEach(o => { const mk = monthOf(o.orderDate);
                      bump(mk, 'orders'); bump(mk, 'value', o.value || 0); });

  return {
    acts, moves, ords,
    rows: Object.values(months).sort((a,b) => b.mk.localeCompare(a.mk)),
    // "converted" = the deal reached C4. An account can convert more than
    // once: it goes back to C0 for the next requirement and comes round again.
    conversions: moves.filter(h => h.toStage === CLOSED).length,
    lastContact: acts.reduce((m,a) => {
      const d = monthOf(a.loggedAt) ? iso(parseDate(a.loggedAt)) : null;
      return d && (!m || d > m) ? d : m; }, null)
  };
}

/* ---- one client, month by month ---------------------------------------- */
function historyOne(accId){

        <b style="font-size:17px">${esc(a.name || 'Client')}</b>
        <span class="sm muted">${esc(a.region || '')}
          ${a.owner ? '· ' + esc(userName(a.owner)) : ''}
          ${a.clientClass ? '· ' + esc(a.clientClass) + ' client' : ''}</span>
        <button class="chip" id="hback" style="margin-left:auto">← All clients</button>
      </div>
    </div>

    <div class="grid2" style="margin-bottom:14px">
      ${tile('Times contacted', String(totals.contacts),
             h.lastContact ? 'last on ' + h.lastContact : 'never logged')}
      ${tile('Stage changes', String(totals.moves), 'recorded moves')}
      ${tile('Times converted', String(h.conversions),
             totals.orders + ' order' + (totals.orders===1?'':'s') + ' billed')}
      ${tile('Billed', inr(totals.value), 'all time')}
    </div>

    <div class="card">
      <h2>Month by month</h2>
      ${h.rows.length ? `<div class="list">${h.rows.map(mRow).join('')}</div>`
        : '<div class="empty">Nothing recorded for this client.</div>'}
      <button class="btn sec" id="hcsv1" style="width:auto;padding:9px 14px;
        margin-top:10px">Download this history</button>
    </div>

    <div class="card">
      <h2>Stage changes</h2>
      <div class="row" style="margin-bottom:10px">
        <div><label for="hfrom">From</label>
          <select id="hfrom" class="fld">${stageOpts(S.histFrom)}</select></div>
        <div><label for="hto">To</label>
          <select id="hto" class="fld">${stageOpts(S.histTo)}</select></div>
      </div>
      ${moves.length ? `<div class="list">${moves.map(moveRow).join('')}</div>`
        : `<div class="empty">${h.moves.length
             ? 'No move matches that filter.'
             : 'No stage change recorded. The workbook only carried a move where the stage actually differed between two rows.'}</div>`}
    </div>

    <div class="card">
      <h2>Every contact · ${acts.length}</h2>
      ${acts.length ? capped(acts, actRow, 40)
        : '<div class="empty">Nothing logged against this client.</div>'}
    </div>`;

  $('#hback').onclick = () => { S.histAcc = null; viewHistory(); };
  $('#hfrom').onchange = () => { S.histFrom = +$('#hfrom').value; historyOne(accId); };
  $('#hto').onchange   = () => { S.histTo   = +$('#hto').value;   historyOne(accId); };
  wireMore(acts, actRow, 40);
  $('#hcsv1').onclick = () => {
    const name = (a.name || 'client').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    download(name + '-history.csv', csv(h.rows, [
      { t:'Month', f:r => r.mk },
      { t:'Times contacted', f:r => r.contacts },
      { t:'Stage changes', f:r => r.moves },
      { t:'Converted', f:r => r.won },
      { t:'Orders', f:r => r.orders },
      { t:'Value', f:r => r.value }]));
  };
}

/* =============================================================== ENTRY LOG
   What was actually fed into the system, newest first, for the range in the
   header. The DCR was a list of entries and people are used to reading it
   that way - "what did we log this week" is a different question from any
   roll-up, and until now the app could not answer it.

   A rep sees their own. A manager sees their team. Nobody has to trust a
   total without being able to look at the rows behind it.                */

function feedRows(uids, from, to){
  const acts = (S.acts || []).filter(a => {
    if (!uids.includes(a.loggedBy)) return false;
    const d = String(a.loggedAt || '').slice(0, 10);
    return d >= from && d <= to;
  });

  /* An order booked the same day on the same deal is the same event as far
     as a reader is concerned, so it is shown on the entry rather than as a
     second line that looks like duplicate work. */
  const orderKey = {};
  S.orders.forEach(o => {
    const d = String(o.orderDate || '').slice(0, 10);
    if (d >= from && d <= to) orderKey[o.opportunityId + '|' + d] = o;
  });

  const rows = acts.map(a => {
    const d = String(a.loggedAt || '').slice(0, 10);
    const opp = S.opps.find(o => o.id === a.opportunityId);
    return {
      date: d,
      time: String(a.loggedAt || '').slice(11, 16),
      accountId: a.accountId,
      account: accName(a.accountId),
      type: a.type || 'Contact',
      by: a.loggedBy,
      remarks: a.remarks || '',
      stage: opp ? opp.stage : null,
      order: orderKey[a.opportunityId + '|' + d] || null
    };
  });

  /* Orders with no activity logged against them the same day still belong in
     a record of what was entered - otherwise revenue appears from nowhere. */
  const covered = new Set(rows.filter(r => r.order).map(r => r.order.id));
  S.orders.forEach(o => {
    const d = String(o.orderDate || '').slice(0, 10);
    if (d < from || d > to) return;
    if (covered.has(o.id)) return;
    if (o.bookedBy && !uids.includes(o.bookedBy)) return;
    rows.push({ date:d, time:String(o.orderDate||'').slice(11,16),
      accountId:o.accountId, account:accName(o.accountId),
      type:'Order', by:o.bookedBy, remarks:'', stage:CLOSED, order:o });
  });

  return rows.sort((a, b) =>
    (b.date + b.time).localeCompare(a.date + a.time));
}

function viewFeed(){
  const uids = repFilterIds();
  const { from, to } = S.range;

  if (!S.orders.length || !S.histReady) {
    $('#view').innerHTML = `<div class="card"><div class="empty">
      <span class="spin"></span><br><br>Loading the log…</div></div>`;
    loadHistory().then(() => { if (S.view === 'feed') viewFeed(); }).catch(() => {});
    return;
  }

  const all = feedRows(uids, from, to);
  S.feedType = S.feedType || 'All';
  S.feedOnlyOrders = !!S.feedOnlyOrders;

  let rows = all;
  if (S.feedType !== 'All') rows = rows.filter(r => r.type === S.feedType);
  if (S.feedOnlyOrders) rows = rows.filter(r => r.order);

  const q = norm(S.feedQ || '');
  if (q) rows = rows.filter(r => norm(r.account).includes(q)
                              || norm(r.remarks).includes(q));

  const val = rows.reduce((n, r) => n + (r.order ? (r.order.value || 0) : 0), 0);
  const withOrder = rows.filter(r => r.order).length;
  const people = new Set(rows.map(r => r.by).filter(Boolean)).size;
  const days = new Set(rows.map(r => r.date)).size;

  const types = ['All', ...new Set(all.map(r => r.type))];
  const tChip = t => `<button class="chip${S.feedType===t?' on':''}"
    data-ft="${esc(t)}">${esc(t)}${t==='All' ? ' ' + all.length : ''}</button>`;

  /* Grouped by day, because that is how a daily call report reads and how
     anyone checking "did the team work on Tuesday" wants to scan it. */
  const byDay = {};
  rows.forEach(r => (byDay[r.date] = byDay[r.date] || []).push(r));
  const dayKeys = Object.keys(byDay).sort().reverse();

  const entry = r => `<div class="it" data-go="${r.accountId}"
      style="align-items:flex-start;flex-direction:column;gap:3px">
    <div style="display:flex;width:100%;gap:8px;align-items:baseline">
      ${r.stage != null ? stageTag(r.stage) : ''}
      <span class="nm">${esc(r.account)}</span>
      <span class="meta">${r.order ? `<b>${inr(r.order.value||0)}</b> · ` : ''}${
        esc(r.type)} · ${esc(userName(r.by))}${
        r.time && r.time !== '00:00' ? ' · ' + esc(r.time) : ''}</span>
    </div>
    ${r.remarks ? `<div class="sm muted">${esc(r.remarks)}</div>` : ''}
    ${r.order && r.order.creditSplit
      && Object.keys(r.order.creditSplit).length > 1 ? `<div class="sm"
      style="color:var(--warn)">Credit ${Object.entries(r.order.creditSplit)
        .map(([u,p]) => Math.round(p*100) + '% ' + esc(userName(u)))
        .join(' · ')}</div>` : ''}
    ${r.order && r.order.creditPending ? `<div class="sm"
      style="color:var(--warn)">Credit split not settled yet</div>` : ''}
    ${r.order ? `<div class="sm muted">${
      r.order.invoiceNumber ? 'Invoice ' + esc(r.order.invoiceNumber)
                            : '<span class="req">no invoice number</span>'}${
      r.order.store ? ' · ' + esc(r.order.store)
                    : ' · <span class="req">no store</span>'}${
      r.order.paymentStatus ? ' · ' + esc(r.order.paymentStatus) : ''}</div>` : ''}
  </div>`;

  const CAP = 12;                       // days shown before "show the rest"
  const shown = S.feedAllDays ? dayKeys : dayKeys.slice(0, CAP);

  $('#view').innerHTML = `
    <div class="grid2" style="margin-bottom:14px">
      ${tile('Entries', rows.length.toLocaleString('en-IN'),
             days + ' day' + (days===1?'':'s') + ' · ' + people
             + ' ' + (people===1?'person':'people'))}
      ${tile('Orders booked', String(withOrder), inr(val) + ' billed')}
      ${tile('Accounts touched',
             String(new Set(rows.map(r => r.accountId)).size),
             'in this range')}
      ${tile('Entries per working day',
             days ? (rows.length / days).toFixed(1) : '—',
             'across the people in view')}
    </div>

    <div class="card">
      <h2>Filter</h2>
      <input id="fq" class="fld" type="search" placeholder="Search account or remarks"
             value="${esc(S.feedQ || '')}" autocapitalize="off" spellcheck="false">
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">
        ${types.map(tChip).join('')}
        <button class="chip${S.feedOnlyOrders?' on':''}" id="fOnly"
          style="margin-left:auto">Only entries with an order</button>
      </div>
    </div>

    ${shown.length ? shown.map(d => `
      <div class="card">
        <h2 style="display:flex;gap:8px;align-items:baseline">
          <span>${esc(dayLabel(d))}</span>
          <span style="margin-left:auto;text-transform:none;letter-spacing:0">
            ${byDay[d].length} entr${byDay[d].length===1?'y':'ies'}${
            (() => { const v = byDay[d].reduce((n,r) =>
                       n + (r.order ? (r.order.value||0) : 0), 0);
                     return v ? ' · ' + inr(v) : ''; })()}</span>
        </h2>
        <div class="list">${byDay[d].map(entry).join('')}</div>
      </div>`).join('')
      : '<div class="card"><div class="empty">Nothing was logged in this range.'
        + '</div></div>'}

    ${dayKeys.length > CAP && !S.feedAllDays ? `<button class="btn sec" id="fMore"
      style="width:auto;padding:9px 14px">Show the other
      ${dayKeys.length - CAP} days</button>` : ''}

    <div class="card" style="margin-top:14px">
      <button class="btn sec" id="fcsv" style="width:auto;padding:9px 14px">
        Download this log</button>
      <p class="hint" style="margin-top:10px">Exactly the rows above, with the
        range and rep filter from the header applied. Tap any entry to open
        that account.</p>
    </div>`;

  wireRows();
  $('#view').querySelectorAll('[data-ft]').forEach(b => b.onclick = () => {
    S.feedType = b.dataset.ft; viewFeed();
  });
  $('#fOnly').onclick = () => { S.feedOnlyOrders = !S.feedOnlyOrders; viewFeed(); };
  const fm = $('#fMore');
  if (fm) fm.onclick = () => { S.feedAllDays = true; viewFeed(); };
  const fq = $('#fq');
  fq.oninput = debounce(() => {
    S.feedQ = fq.value; const at = fq.selectionStart;
    viewFeed();
    const n = $('#fq'); if (n) { n.focus(); n.setSelectionRange(at, at); }
  }, 220);
  $('#fcsv').onclick = () => download('entry-log-' + from + '-to-' + to + '.csv',
    csv(rows, [
      { t:'Date', f:r => r.date },
      { t:'Time', f:r => r.time },
      { t:'Account', f:r => r.account },
      { t:'Type', f:r => r.type },
      { t:'Logged by', f:r => userName(r.by) },
      { t:'Stage', f:r => r.stage == null ? '' : STAGES[r.stage].k },
      { t:'Remarks', f:r => r.remarks },
      { t:'Order value', f:r => r.order ? (r.order.value || 0) : '' },
      { t:'Invoice', f:r => r.order ? (r.order.invoiceNumber || '') : '' },
      { t:'Store', f:r => r.order ? (r.order.store || '') : '' },
      { t:'Payment', f:r => r.order ? (r.order.paymentStatus || '') : '' }]));
}

/* 'Today', 'Yesterday', then the date - a log is read relative to now. */
function dayLabel(d){
  const t = iso(today());
  if (d === t) return 'Today · ' + d;
  const y = new Date(today().getTime() - DAY);
  if (d === iso(y)) return 'Yesterday · ' + d;
  const dt = asDate(d);
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()] + ' · ' + d;
}
