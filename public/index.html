<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paradise Institutional Sales</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#15181d; --mute:#6b7280; --line:#e3e6ea;
    --brand:#8a1538; --brand-ink:#fff; --ok:#12805c; --warn:#b45309; --bad:#b3261e;
    --c0:#6b7280; --c1:#2563eb; --c2:#7c3aed; --c2f:#9333ea; --c3:#0891b2;
    --c4:#12805c; --cx:#b3261e;
    --r:10px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]){
      --bg:#111418; --card:#191d23; --ink:#e8eaed; --mute:#9aa3ad; --line:#2a3038;
      --sh:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme=dark]{
    --bg:#111418; --card:#191d23; --ink:#e8eaed; --mute:#9aa3ad; --line:#2a3038;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,
    "Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--c1)}

  /* ---------- sign in ---------- */
  #gate{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
  .gatecard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:26px 22px;box-shadow:var(--sh)}
  .logo{width:42px;height:42px;border-radius:11px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:17px;margin-bottom:14px}
  .gatecard h1{font-size:19px;margin:0 0 4px}
  .gatecard p.sub{margin:0 0 18px;color:var(--mute);font-size:13.5px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);
    margin:0 0 5px;letter-spacing:.01em}
  /* 16px is not a style choice: iOS Safari zooms the whole page when you focus
     a field smaller than that, and it does not zoom back out. A rep filling in
     an invoice number on a shop floor would be left panning a zoomed layout. */
  .fld{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    background:var(--bg);margin-bottom:13px;font-size:16px}
  input,select,textarea{font-size:16px}
  .fld:focus{outline:2px solid var(--c1);outline-offset:-1px;border-color:transparent}
  .btn{width:100%;padding:11px 14px;border:0;border-radius:9px;background:var(--brand);
    color:var(--brand-ink);font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;color:var(--mute);font-weight:500}
  .btn.sec{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .msg{font-size:13px;margin:10px 0 0;padding:9px 11px;border-radius:8px;display:none}
  .msg.err{display:block;background:#fdecea;color:#8c1d18}
  .msg.ok{display:block;background:#e7f5ef;color:#0b6b4c}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]) .msg.err{background:#3a1d1a;color:#f0b3ad}
    :root:not([data-theme=light]) .msg.ok{background:#122e24;color:#8fd9bd}
  }
  .otpbox{display:flex;gap:8px}
  .otpbox .fld{text-align:center;letter-spacing:6px;font-size:20px;font-weight:600}
  .authtabs{display:flex;gap:4px;margin:14px 0 18px;
    border-bottom:1px solid var(--line)}
  .authtab{flex:1;padding:9px 8px;border:0;background:none;cursor:pointer;
    font-size:14px;font-weight:600;color:var(--mute);margin-bottom:-1px;
    border-bottom:2px solid transparent}
  .authtab.active{color:var(--brand);border-bottom-color:var(--brand)}
  .pwwrap{position:relative}
  .pwwrap .fld{padding-right:60px;width:100%}
  /* Full-height hit area: a 25px-tall target is a miss on a phone. */
  .pwbtn{position:absolute;right:4px;top:0;height:46px;display:flex;
    align-items:center;background:none;border:0;font-size:12px;font-weight:700;
    color:var(--brand);padding:0 10px;cursor:pointer}
grep -c PASTE public/index.html  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]) .authtab.active{color:var(--ink);
      border-bottom-color:var(--ink)}
    :root:not([data-theme=light]) .pwbtn{color:var(--c1)}
  }

  /* ---------- shell ---------- */
  #app{display:none;min-height:100dvh;flex-direction:column}
  header.top{position:sticky;top:0;z-index:40;background:var(--card);
    border-bottom:1px solid var(--line);padding:9px 14px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .burger{width:36px;height:36px;border:1px solid var(--line);background:transparent;
    border-radius:9px;cursor:pointer;display:grid;place-items:center;flex:none}
  .burger span{display:block;width:16px;height:1.8px;background:var(--ink);
    border-radius:2px;box-shadow:0 5px 0 var(--ink),0 -5px 0 var(--ink)}
  .vtitle{font-weight:650;font-size:16px;margin-right:auto}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
    border:1px solid var(--line);border-radius:999px;background:var(--bg);
    font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--brand);color:#fff;border-color:transparent}
  main{padding:16px 14px 60px;max-width:1180px;width:100%;margin:0 auto}

  /* drawer */
  #scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:50;display:none}
  #drawer{position:fixed;inset:0 auto 0 0;width:268px;max-width:84vw;z-index:51;
    background:var(--card);border-right:1px solid var(--line);
    transform:translateX(-100%);transition:transform .18s ease;
    display:flex;flex-direction:column;padding:14px 0}
  #drawer.open{transform:none}
  .dhead{padding:4px 16px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .dhead b{display:block;font-size:15px}
  .dhead small{color:var(--mute);font-size:12.5px}
  .nav{display:flex;flex-direction:column;gap:1px;overflow:auto}
  .nav button{display:flex;align-items:center;gap:11px;padding:11px 16px;border:0;
    background:transparent;text-align:left;cursor:pointer;font-size:14.5px;width:100%}
  .nav button:hover{background:var(--bg)}
  .nav button.on{background:var(--bg);font-weight:650;
    box-shadow:inset 3px 0 0 var(--brand)}
  .nav .ico{width:18px;text-align:center;flex:none;opacity:.8}
  .nav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;padding:1px 7px;
    border-radius:999px;background:var(--bad);color:#fff}
  .dfoot{margin-top:auto;padding:12px 16px 0;border-top:1px solid var(--line)}

  /* ---------- bits ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;box-shadow:var(--sh);margin-bottom:14px}
  .card>h2{font-size:14px;margin:0 0 12px;letter-spacing:.02em;text-transform:uppercase;
    color:var(--mute)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1 1 170px;min-width:0}
  .row .fld{margin-bottom:0}
  abbr[title]{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
  .muted{color:var(--mute)}
  .sm{font-size:13px}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;
    font-weight:650;color:#fff;white-space:nowrap}
  .empty{padding:26px 14px;text-align:center;color:var(--mute);font-size:14px}
  .list{border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .list .it{display:flex;gap:10px;align-items:center;padding:10px 12px;
    border-bottom:1px solid var(--line);cursor:pointer;background:var(--card)}
  .list .it:last-child{border-bottom:0}
  .list .it:hover{background:var(--bg)}
  .it .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .it .meta{color:var(--mute);font-size:12.5px;margin-left:auto;white-space:nowrap}
  .req{color:var(--bad)}
  .hint{font-size:12.5px;color:var(--mute);margin:-8px 0 12px}
  .row + .hint{margin-top:8px}
  .banner{padding:10px 12px;border-radius:9px;background:#fff8e6;color:#7a4a05;
    font-size:13.5px;border:1px solid #f2d9a0;margin-bottom:12px}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]) .banner{background:#2c2410;color:#e9c97c;
      border-color:#4a3b14}
  }
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:12px 14px}
  .stat .k{font-size:12px;color:var(--mute);letter-spacing:.02em}
  .stat .v{font-size:22px;font-weight:700;margin-top:3px}
  /* ---------- admin ---------- */
  .tgrid{display:grid;grid-template-columns:72px repeat(3,1fr);gap:6px;
    align-items:center}
  .tgrid .th{font-size:11.5px;font-weight:700;color:var(--mute);
    letter-spacing:.02em;text-transform:uppercase}
  .tgrid .tm{font-size:13px;font-weight:600}
  .tgrid .fld{margin-bottom:0;text-align:right;padding:9px 10px}
  /* Four columns squeeze a 7-digit figure into 60px on a small phone. Below
     430px the month becomes its own full-width row instead, which gives each
     input about a third of the screen. */
  @media (max-width:430px){
    .tgrid{grid-template-columns:repeat(3,1fr);gap:5px}
    .tgrid .th:first-child{display:none}
    .tgrid .tm{grid-column:1/-1;margin-top:10px;color:var(--mute);
      font-size:12px;letter-spacing:.02em;text-transform:uppercase}
    .tgrid .fld{padding:9px 6px}
  }

  /* ---------- dashboard ---------- */
  .funnel{display:flex;flex-direction:column;gap:2px}
  .fnrow{display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;
    border:0;background:none;cursor:pointer;text-align:left;border-radius:8px;
    min-height:44px}
  .fnrow:hover{background:var(--bg)}
  .fnk{flex:0 0 46px;font-weight:700;font-size:12.5px}
  .fnbar{flex:1 1 auto;height:12px;background:var(--bg);border-radius:6px;
    overflow:hidden;min-width:40px}
  /* 4px rounded data-end, anchored to the baseline */
  .fnfill{display:block;height:100%;border-radius:0 4px 4px 0}
  .fnn{flex:0 0 34px;text-align:right;font-size:12.5px;color:var(--mute)}
  .fnv{flex:0 0 76px;text-align:right;font-weight:650;font-size:13px}
  .splitbar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;
    background:var(--bg)}
  .splitbar span{display:block}
  .meter{width:100%;height:8px;background:var(--bg);border-radius:4px;
    overflow:hidden}
  .meter span{display:block;height:100%;border-radius:0 4px 4px 0}
  .bridge{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;
    border-top:1px solid var(--line);padding-top:12px}
  .bridge>div{flex:1 1 92px;min-width:0}
  .bridge span{display:block;font-size:11.5px;letter-spacing:.02em}
  .bridge b{font-size:15px}
  .chip.sssg{flex:0 0 auto}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============================ SIGN IN ============================ -->
<!-- Same three screens as Project Flow and the Mystery Audit dashboard:
     log in with a password, and a code only to prove the address at signup. -->
<div id="gate">
  <div class="gatecard">
    <div class="logo">P</div>
    <h1>Institutional Sales</h1>

    <div class="authtabs">
      <button id="tabLogin" class="authtab active">Log in</button>
      <button id="tabSignup" class="authtab">Sign up</button>
    </div>

    <!-- log in: email + password, no code -->
    <div id="loginForm">
      <label for="loginEmail">Work email</label>
      <input id="loginEmail" class="fld" type="email" autocomplete="username"
             inputmode="email" autocapitalize="off" spellcheck="false"
             placeholder="name@paradisefoodcourt.in">

      <label for="loginPassword">Password</label>
      <div class="pwwrap">
        <input id="loginPassword" class="fld" type="password"
               autocomplete="current-password" placeholder="••••••••">
        <button type="button" id="pwToggle" class="pwbtn"
                aria-label="Show password">Show</button>
      </div>

      <button id="loginBtn" class="btn">Log in</button>
      <button id="forgotBtn" class="btn ghost" style="margin-top:8px">
        Forgot password?</button>
      <p id="loginMsg" class="msg"></p>
    </div>

    <!-- sign up, step 1 of 3: the address -->
    <div id="signupStep1" style="display:none">
      <p class="sub">We'll email you a 6-digit code to check the address is
        yours. Only @paradisefoodcourt.in addresses can sign up.</p>
      <label for="signupEmail">Work email</label>
      <input id="signupEmail" class="fld" type="email" autocomplete="username"
             inputmode="email" autocapitalize="off" spellcheck="false"
             placeholder="name@paradisefoodcourt.in">
      <button id="sendOtpBtn" class="btn">Send verification code</button>
      <p id="signupStep1Msg" class="msg"></p>
    </div>

    <!-- sign up, step 2 of 3: the code -->
    <div id="signupStep2" style="display:none">
      <p class="sub">Enter the 6-digit code sent to
        <b id="signupEmailConfirm"></b>. It expires in 10 minutes.</p>
      <div class="otpbox">
        <input id="otpInput" class="fld" inputmode="numeric" maxlength="6"
               autocomplete="one-time-code" placeholder="000000">
      </div>
      <button id="verifyOtpBtn" class="btn">Verify code</button>
      <button id="resendOtpBtn" class="btn ghost" style="margin-top:8px">
        Resend code</button>
      <p id="signupStep2Msg" class="msg"></p>
    </div>

    <!-- sign up, step 3 of 3: name and password -->
    <div id="signupStep3" style="display:none">
      <p class="sub" id="step3Intro">Create a password for your account.</p>

      <div id="nameWrap">
        <label for="signupName">Your name <span class="req">*</span></label>
        <input id="signupName" class="fld" autocomplete="name"
               placeholder="How it should appear in reports">
      </div>

      <label for="newPassword">Password (min 8 characters)</label>
      <input id="newPassword" class="fld" type="password"
             autocomplete="new-password" placeholder="••••••••">

      <label for="newPassword2">Confirm password</label>
      <input id="newPassword2" class="fld" type="password"
             autocomplete="new-password" placeholder="••••••••">

      <button id="createAccountBtn" class="btn">Create account</button>
      <p id="signupStep3Msg" class="msg"></p>
    </div>
  </div>
</div>

<!-- ============================== APP ============================== -->
<div id="app">
  <header class="top">
    <button class="burger" id="burger" aria-label="Menu"><span></span></button>
    <div class="vtitle" id="vtitle">Dashboard</div>
    <button class="chip" id="rangeChip">MTD</button>
    <button class="chip" id="repChip">All reps</button>
    <button class="chip" id="whoChip"></button>
  </header>
  <main id="view"><div class="empty"><span class="spin"></span></div></main>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dhead"><b id="dName">—</b><small id="dRole"></small></div>
  <div class="nav" id="nav"></div>
  <div class="dfoot">
    <button class="btn sec" id="signout">Sign out</button>
  </div>
</aside>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithCustomToken, signInWithEmailAndPassword,
         sendPasswordResetEmail, setPersistence, browserLocalPersistence,
         browserSessionPersistence, inMemoryPersistence,
         onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc,
         addDoc, query, where, serverTimestamp, writeBatch }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getFunctions, httpsCallable }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js';

/* ------------------------------------------------------------------ config
   Firebase console > Project settings > General > Your apps > Web app.
   Paste that block here. Nothing else in this file needs editing.        */
const firebaseConfig = {
  apiKey:            "AIzaSyAdDN6EAXWvPHCWypkoMvojKEVMBmEEyC0",
  authDomain:        "paradise-insti-crm.firebaseapp.com",
  projectId:         "paradise-insti-crm",
  storageBucket:     "paradise-insti-crm.firebasestorage.app",
  messagingSenderId: "80522214398",
  appId:             "1:80522214398:web:364a8796d276f2df401eaf"
};
const REGION = 'asia-south1';

const fb   = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db   = getFirestore(fb);
const fns  = getFunctions(fb, REGION);
const call = n => httpsCallable(fns, n);

/* --------------------------------------------------------------- constants */
const STAGES = [
  { k:'C0',  n:'Introduction',          v:'--c0',  w:.10 },
  { k:'C1',  n:'Follow-up',             v:'--c1',  w:.25 },
  { k:'C2',  n:'Negotiation',           v:'--c2',  w:.45 },
  { k:'C2F', n:'Negotiation follow-up', v:'--c2f', w:.60 },
  { k:'C3',  n:'Confirmed',             v:'--c3',  w:.80 },
  { k:'C4',  n:'Closed',                v:'--c4',  w:1   },
  { k:'X',   n:'Cancelled',             v:'--cx',  w:0   }
];
const CLOSED = 5, CANCELLED = 6;

// Hover definitions. Every abbreviation the app shows is in here.
const DEFS = {
  C0:'C0 — Introduction. First contact made, nothing quoted yet.',
  C1:'C1 — Follow-up. Interest confirmed, chasing a requirement.',
  C2:'C2 — Negotiation. Quote out, terms under discussion.',
  C2F:'C2F — Negotiation follow-up. Quote out, waiting on their decision.',
  C3:'C3 — Confirmed. Verbally agreed, order not yet raised.',
  C4:'C4 — Closed. Order booked, invoice raised.',
  X:'Cancelled. Deal lost or dropped, with a reason recorded.',
  MTD:'Month to date — 1st of this month to today.',
  QTD:'Quarter to date — start of this fiscal quarter to today.',
  YTD:'Year to date — 1 April to today.',
  FY:'Financial year, April to March. FY27 = Apr 2026 to Mar 2027.',
  SLA:'Service level agreement — days a deal may sit in a stage before it is flagged.',
  SSSG:'Same store sales growth — growth from clients who ordered in both periods.',
  SPOC:'Single point of contact — the named person at the account.',
  DCR:'Daily call report — the workbook this tool replaces.',
  CPU:'Central production unit — an aggregator kitchen serving several sites.',
  TY:'This year.', LY:'Last year.',
  NA:'No next action date recorded.'
};
const ab = k => `<abbr title="${(DEFS[k]||k).replace(/"/g,'&quot;')}">${k}</abbr>`;

const ACT_TYPES = ['Call','Visit','Email','WhatsApp','Meeting','Sampling'];
const PAY_STATUS = ['Pending','Partial','Received','Overdue'];

/* ----------------------------------------------------------------- helpers */
const $  = s => document.querySelector(s);
const esc = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;');
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const digits = s => String(s||'').replace(/\D/g,'');

function inr(n){
  n = Number(n)||0;
  if (Math.abs(n) >= 1e7) return '₹'+(n/1e7).toFixed(2)+' Cr';
  if (Math.abs(n) >= 1e5) return '₹'+(n/1e5).toFixed(1)+'L';
  return '₹'+n.toLocaleString('en-IN',{maximumFractionDigits:0});
}
const iso  = d => d.toISOString().slice(0,10);
const today = () => new Date();
function parseDate(v){
  if (!v) return null;
  if (typeof v === 'object' && v.toDate) return v.toDate();
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
const dayspan = (a,b) => Math.round((b-a)/864e5);
function fyOf(d){ return d.getMonth()>=3 ? d.getFullYear()+1 : d.getFullYear(); }

/* Default range is month to date, computed from the clock, so on 1 Oct it
   becomes 1-1 Oct without anyone touching it. */
function mtd(){
  const t = today();
  return { from: iso(new Date(t.getFullYear(), t.getMonth(), 1)), to: iso(t),
           label:'MTD' };
}
function rangePresets(){
  const t = today(), y = t.getFullYear(), m = t.getMonth();
  const fys = new Date(m>=3 ? y : y-1, 3, 1);
  const q  = Math.floor(((m+9)%12)/3);            // fiscal quarter, Apr = Q1
  const qs = new Date(fys.getFullYear(), 3+q*3, 1);
  const lm = new Date(y, m-1, 1);
  return [
    mtd(),
    { label:'Last month', from:iso(lm), to:iso(new Date(y,m,0)) },
    { label:'QTD', from:iso(qs), to:iso(t) },
    { label:'YTD', from:iso(fys), to:iso(t) },
    { label:'Since Sep-23', from:'2023-09-01', to:iso(t) }
  ];
}

/* --------------------------------------------------------------- app state */
const S = {
  me:null, users:[], accounts:[], opps:[], contacts:[], orders:[], targets:[],
  byId:{}, view:'dash', range:mtd(), reps:[], loaded:false
};
const userName = id => (S.byId[id]||{}).name || '—';
const anushikha = () => S.users.find(u => /anushikha/i.test(u.name||''));

/* Who a person may see: themselves, plus reportees if they manage. */
function visibleUserIds(){
  if (!S.me) return [];
  if (S.me.role === 'admin') return S.users.map(u=>u.id);
  const mine = [S.me.id];
  const walk = id => S.users.filter(u=>u.managerId===id)
                            .forEach(u=>{ mine.push(u.id); walk(u.id); });
  walk(S.me.id);
  return mine;
}
function repFilterIds(){
  const vis = visibleUserIds();
  return S.reps.length ? S.reps.filter(r=>vis.includes(r)) : vis;
}

/* ================================================================= SIGN IN */
/* Matches Project Flow and the Mystery Audit dashboard. Passwords are handled
   by Firebase Auth; the 6-digit code only proves the address at signup. */

/* LOCAL persistence needs IndexedDB, which Safari Private Browsing and other
   private modes restrict. If it fails silently it can leave the Auth SDK
   broken for the rest of the tab, so fall back a step at a time. Lifted from
   the Mystery Audit dashboard, where this was a real bug. */
setPersistence(auth, browserLocalPersistence)
  .catch(() => setPersistence(auth, browserSessionPersistence))
  .catch(() => setPersistence(auth, inMemoryPersistence))
  .catch(() => {});

/* Guards against an auth call that never settles — without it the button can
   read 'Signing in…' forever with no way to tell it has failed. */
function withTimeout(p, ms, msg) {
  let t;
  return Promise.race([
    p,
    new Promise((_, rej) => { t = setTimeout(() => rej(new Error(msg)), ms); })
  ]).finally(() => clearTimeout(t));
}

function msg(id, text, cls) {
  const el = $('#' + id);
  el.textContent = text || '';
  el.className = 'msg' + (text ? ' ' + (cls || 'err') : '');
}
const clearMsgs = () => ['loginMsg','signupStep1Msg','signupStep2Msg','signupStep3Msg']
  .forEach(i => msg(i, ''));

/* Never show a raw 'INTERNAL' or a Firebase error code to a rep. */
function friendly(e, fallback) {
  const code = (e && e.code) || '';
  if (/wrong-password|invalid-credential|user-not-found/.test(code))
    return 'Incorrect email or password.';
  if (/too-many-requests/.test(code))
    return 'Too many attempts. Wait a few minutes and try again.';
  if (/invalid-email/.test(code)) return 'Enter a valid email address.';
  if (/network-request-failed/.test(code))
    return 'Could not reach the server. Check your connection.';
  const m = (e && e.message) || '';
  if (!m || /^internal$/i.test(m)) return fallback || 'Something went wrong. Try again.';
  return m;
}

function busy(btn, label) {
  if (btn.dataset.orig === undefined) btn.dataset.orig = btn.textContent;
  btn.disabled = true; btn.textContent = label;
  btn.style.opacity = '.6'; btn.style.cursor = 'not-allowed';
}
function done(btn) {
  if (btn.dataset.orig !== undefined) btn.textContent = btn.dataset.orig;
  btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = '';
}

const PANES = ['loginForm','signupStep1','signupStep2','signupStep3'];
function showPane(which) {
  PANES.forEach(p => $('#' + p).style.display = p === which ? '' : 'none');
  $('#tabLogin').classList.toggle('active', which === 'loginForm');
  $('#tabSignup').classList.toggle('active', which !== 'loginForm');
}

      'Sign-in timed out — check your connection and try again.');

  } catch (e) {
    msg('loginMsg', friendly(e, 'Sign-in failed. Try again.'));

$('#createAccountBtn').onclick = async () => {

async function grab(name){
  const s = await getDocs(collection(db, name));
  return s.docs.map(d => ({ id:d.id, ...d.data() }));
}

async function boot(authUser){
  const meSnap = await getDoc(doc(db,'users',authUser.uid));
  if (!meSnap.exists()) throw new Error('Your user record is missing. Ask Ayush.');
  S.me = { id: authUser.uid, ...meSnap.data() };

  $('#dName').textContent = S.me.name || authUser.email;
  $('#dRole').textContent = ({admin:'Administrator', manager:'Manager', rep:'Sales'}
                             [S.me.role] || S.me.role) + ' · ' + (S.me.email||'');
  $('#whoChip').textContent = (S.me.name||'?').split(' ')[0];

  const [users, accounts, opps, contacts] = await Promise.all(
    ['users','accounts','opportunities','contacts'].map(grab));
  S.users = users; S.accounts = accounts; S.opps = opps; S.contacts = contacts;
  users.forEach(u => S.byId[u.id] = u);
  accounts.forEach(a => S.byId[a.id] = a);

  buildNav();
  S.loaded = true;
  go(S.view);

  // Heavier collections load after the first paint.
  grab('orders').then(o => { S.orders = o;  if (S.view==='dash') go('dash'); });
  grab('targets').then(t => { S.targets = t; if (S.view==='dash') go('dash'); });
}

let modalSave = null;
function modal(title, html, wire){
  closeModal();
  const d = document.createElement('div');
  d.id = 'modal';
  d.innerHTML = `<div style="position:fixed;inset:0;background:rgba(10,12,16,.5);
      z-index:60;display:grid;place-items:end center;padding:0">
      <div style="background:var(--card);width:100%;max-width:520px;
        border-radius:14px 14px 0 0;max-height:90dvh;overflow:auto;padding:16px">
        <div style="display:flex;align-items:center;margin-bottom:12px">
          <b style="font-size:16px">${esc(title)}</b>
          <button id="mx" class="chip" style="margin-left:auto">Close</button>
        </div>
        <div id="mbody"></div>
        <p id="merr" class="msg"></p>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn sec" id="mcancel" style="flex:1">Cancel</button>
          <button class="btn" id="mok" style="flex:2">Save</button>
        </div>
      </div></div>`;
  document.body.appendChild(d);
  d.querySelector('#mbody').innerHTML = html;
  modalSave = wire ? wire(d.querySelector('#mbody')) : null;
  if (!modalSave) d.querySelector('#mok').style.display = 'none';
  d.querySelector('#mx').onclick = closeModal;
  d.querySelector('#mcancel').onclick = closeModal;
  d.querySelector('#mok').onclick = async () => {
    const btn = d.querySelector('#mok');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const err = await modalSave();
      if (err) { merr(err); btn.disabled=false; btn.textContent='Save'; return; }
      closeModal();
    } catch(e){
      merr(e.message||'Could not save.'); btn.disabled=false; btn.textContent='Save';
    }
  };
}
function merr(t){
  const e = document.querySelector('#merr');
  if (e) { e.textContent = t; e.className = 'msg err'; }
}
function closeModal(){
  const m = document.querySelector('#modal');
  if (m) m.remove();
  modalSave = null;
}

function runSearch(raw){
  const t = raw.trim();
  const box = $('#qres');
  if (t.length < 2) { box.innerHTML = ''; return; }

  const d = digits(t);
  let hits;
  if (d.length >= 3) {
    const accIds = new Set(S.contacts
      .filter(c => (c.phoneNormalised || digits(c.phone)).includes(d))
      .map(c => c.accountId));
    hits = S.accounts.filter(a => accIds.has(a.id));
  } else {
    const n = norm(t);
    hits = S.accounts.filter(a => (a.nameNormalised || norm(a.name)).includes(n));
  }

  if (!hits.length) {
    box.innerHTML = `<div class="empty">Nothing matched “${esc(t)}”.
      Use ＋ New account below.</div>`;
    return;
  }
  const shown = hits.slice(0, 40);
  box.innerHTML = `<div class="list">` + shown.map(a => {
    const o = S.opps.find(x => x.accountId === a.id);
    const st = o ? STAGES[o.stage] : null;
    const ph = (S.contacts.find(c => c.accountId===a.id && c.phone) || {}).phone;
    return `<div class="it" data-a="${a.id}">
      <span class="nm">${esc(a.name)}</span>
      ${st ? `<span class="tag" style="background:var(${st.v})">${st.k}</span>` : ''}
      <span class="meta">${esc(ph || 'no number')} · ${esc(userName(a.owner))}</span>
    </div>`;
  }).join('') + `</div>` +
    (hits.length > shown.length
      ? `<p class="hint" style="margin-top:8px">Showing 40 of ${hits.length}.
         Keep typing to narrow it.</p>` : '');

  box.querySelectorAll('[data-a]').forEach(el =>
    el.onclick = () => pick(el.dataset.a));
}

      </div>

      </div>
      <p class="hint">Invoice number and payment status are required — the
        database rejects a closed order without them. Payment status starts
        blank on purpose, so it is a choice rather than a default.</p>`;
  }

  if (s === CANCELLED) {
    h += `<label for="loss">Why was it lost? <span class="req">*</span></label>
      <select id="loss" class="fld">
        <option value="">Pick one</option>
        ${['Price / budget','Went to competitor','Requirement dropped',
           'No response','Quality concern','Distance / logistics',
           'Menu not suitable','Other'].map(r=>`<option>${r}</option>`).join('')}
      </select>`;
  }
  box.innerHTML = h;

  const sel = $('#asgn'), an = anushikha();
  if (sel) sel.onchange = () => {
    $('#asgnWhyWrap').style.display = (an && sel.value===an.id) ? 'none' : '';
  };
}

function lmsg(t, cls){
  const e = $('#lmsg');
  e.textContent = t || ''; e.className = 'msg' + (t?' '+cls:'');
}

async function saveLog(){
  const { account } = logSel;
  let { opp } = logSel;
  const s = +$('#stage').value;
  const btn = $('#save');
  const val = id => { const e=$('#'+id); return e ? e.value.trim() : ''; };

  const remarks = val('remarks');
  if (!remarks) return lmsg('Say what happened — remarks are required.','err');

  const assignTo = val('asgn');
  const why = val('asgnWhy');
  const an = anushikha();
  if (assignTo && an && assignTo !== an.id && !why)
    return lmsg('Give a reason for assigning away from '+an.name+'.','err');

  if (s === CLOSED) {
    if (!Number(digits(val('ov')))) return lmsg('Order value is required to close.','err');
    if (!val('inv')) return lmsg('Invoice number is required to close.','err');
    if (!val('pay')) return lmsg('Payment status is required to close.','err');
  }
  if (s === CANCELLED && !val('loss'))
    return lmsg('Pick a loss reason before cancelling.','err');
  if (s < CLOSED && !val('nad'))
    return lmsg('An open deal needs a next action date.','err');

  btn.disabled = true; btn.textContent = 'Saving…'; lmsg('');
  try {
    const when = val('adate') ? new Date(val('adate')) : today();
    const batch = writeBatch(db);

    // contact, if the rep filled one in
    if (val('cphone')) {
      const ph = digits(val('cphone'));
      batch.set(doc(collection(db,'contacts')), {
        accountId: account.id, name: val('cname') || 'Contact',
        phone: ph, phoneNormalised: ph, email:'', designation:'',
        isPrimary: true, createdAt: serverTimestamp(), createdBy: S.me.id
      });
    }

    // opportunity
    const oppData = {
      accountId: account.id, name: account.name, stage: s,
      stageSince: when.toISOString(),
      nextActionDate: s < CLOSED ? new Date(val('nad')).toISOString() : null,
      nextActionType: val('nat') || '',
      lossReason: s === CANCELLED ? val('loss') : null,
      closedAt: s >= CLOSED ? when.toISOString() : null
    };
    if (assignTo) {
      oppData.owner = assignTo;
      if (why) oppData.assignReason = why;
    }
    let oppId;
    if (opp) {
      oppId = opp.id;
      batch.update(doc(db,'opportunities',opp.id), oppData);
    } else {
      const ref = doc(collection(db,'opportunities'));
      oppId = ref.id;
      batch.set(ref, { ...oppData, owner: oppData.owner || S.me.id,
        expectedValue: 0, quotedValue: 0, confirmedValue: 0,
        expectedOrderDate: null, temperature:'', source:'app',
        createdAt: serverTimestamp() });
    }

    // activity
    batch.set(doc(collection(db,'activities')), {
      accountId: account.id, opportunityId: oppId, type: val('atype'),
      remarks, checkIn: null, loggedBy: S.me.id,
      loggedAt: when.toISOString()
    });

    // order, only on close
    if (s === CLOSED) {
      batch.set(doc(collection(db,'orders')), {
        accountId: account.id, opportunityId: oppId, bookedBy: S.me.id,
        value: Number(digits(val('ov'))), orderDate: when.toISOString(),
        store: val('ostore') || '', channel:'app',
        invoiceNumber: val('inv'), paymentStatus: val('pay'),
        paymentReceivedAt: null, financeApprovedAt: null,
        aggregator: null, commissionPct: 0
      });
    }

    await batch.commit();

    // keep the local copy in step so the screen is honest without a reload
    if (opp) Object.assign(opp, oppData);
    else S.opps.push({ id: oppId, accountId: account.id, stage: s, ...oppData });

    logSel = null;
    $('#logForm').innerHTML = `<div class="card"><h2>Saved</h2>
      <p>${esc(account.name)} logged at ${ab(STAGES[s].k)}.</p>
      <button class="btn sec" id="again" style="width:auto;padding:9px 14px">
        Log another</button></div>`;
    $('#again').onclick = viewLog;
    $('#q').value = ''; $('#qres').innerHTML = '';
  } catch(e){
    lmsg(e.message || 'Could not save.','err');
    btn.disabled = false; btn.textContent = 'Save activity';
  }
}

/* ================================================================ DASHBOARD
   Forms chosen before colour. The headline numbers are a KPI row of stat
   tiles, not a bar chart of six unrelated measures. The stage funnel is a
   magnitude comparison, so it is one hue light-to-dark with the stage code
   direct-laballed - NOT one colour per stage, because the stage palette fails
   CVD separation as chart marks (C1 blue and C2 purple sit 0.4 apart for
   deuteranopes). As labelled chips they are fine; as bars they would not be. */

const DAY = 864e5;
const asDate = s => new Date(s + 'T00:00:00');
const monthsBetween = (from, to) => {
  const out = [], a = asDate(from), b = asDate(to);
  let y = a.getFullYear(), m = a.getMonth();
  while (y < b.getFullYear() || (y === b.getFullYear() && m <= b.getMonth())) {
    out.push('%04d-%02d'.replace('%04d', y).replace('%02d', String(m+1).padStart(2,'0')));
    m++; if (m > 11) { m = 0; y++; }
  }
  return out;
};

/* A target is a monthly figure. Asked for 1-15 Sep, the honest comparison is
   half of September's target, not all of it - otherwise every month-to-date
   view reads as catastrophic underperformance until the 30th. */
function targetForRange(from, to, uids) {
  const a = asDate(from), b = asDate(to);
  let total = 0;
  for (const mk of monthsBetween(from, to)) {
    const [y, m] = mk.split('-').map(Number);
    const mStart = new Date(y, m - 1, 1), mEnd = new Date(y, m, 0);
    const days = mEnd.getDate();
    const lo = a > mStart ? a : mStart, hi = b < mEnd ? b : mEnd;
    const covered = Math.max(0, Math.round((hi - lo) / DAY) + 1);
    if (!covered) continue;
    const monthly = S.targets
      .filter(t => t.scope === 'rep' && t.bucket === 'overall'
                && t.month === mk && uids.includes(t.userId))
      .reduce((n, t) => n + (t.amount || 0), 0);
    total += monthly * (covered / days);
  }
  return total;
}

function ordersIn(from, to, uids) {
  const a = asDate(from), b = new Date(asDate(to).getTime() + DAY - 1);
  return S.orders.filter(o => {
    const d = parseDate(o.orderDate);
    return d && d >= a && d <= b && (!o.bookedBy || uids.includes(o.bookedBy));
  });
}

// Same calendar window, one year back - the basis for SSSG and the LY line.
const lastYear = iso_ => {
  const d = asDate(iso_); d.setFullYear(d.getFullYear() - 1); return iso(d);
};

function tile(k, v, sub, tone) {
  return `<div class="stat">
    <div class="k">${k}</div>
    <div class="v"${tone ? ` style="color:var(${tone})"` : ''}>${v}</div>
    ${sub ? `<div class="k" style="margin-top:4px">${sub}</div>` : ''}
  </div>`;
}

function viewDash() {
  const uids = repFilterIds();
  const { from, to } = S.range;

  if (!S.orders.length) {
    $('#view').innerHTML = `<div class="card"><div class="empty">
      <span class="spin"></span><br><br>Loading orders…</div></div>`;
    return;
  }

  const ord = ordersIn(from, to, uids);
  const net = ord.reduce((n, o) => n + (o.value || 0), 0);
  const tgt = targetForRange(from, to, uids);
  const ach = tgt ? net / tgt : 0;
  const accountsBilled = new Set(ord.map(o => o.accountId)).size;

  // new vs old, by the account's class at load time
  let newRev = 0, oldRev = 0;
  ord.forEach(o => {
    const a = S.byId[o.accountId];
    if (a && a.clientClass === 'old') oldRev += o.value || 0; else newRev += o.value || 0;
  });

  // open pipeline, weighted by the stage's own probability
  const open = S.opps.filter(o => o.stage < CLOSED && uids.includes(o.owner));
  const openVal = open.reduce((n, o) => n + (o.expectedValue || 0), 0);
  const weighted = open.reduce((n, o) => n + (o.expectedValue || 0) * STAGES[o.stage].w, 0);

  // last year, same window
  const lyOrd = ordersIn(lastYear(from), lastYear(to), uids);
  const lyNet = lyOrd.reduce((n, o) => n + (o.value || 0), 0);
  const growth = lyNet ? net / lyNet - 1 : null;

  // SSSG: only clients who bought in BOTH windows
  const tyBy = {}, lyBy = {};
  ord.forEach(o => tyBy[o.accountId] = (tyBy[o.accountId] || 0) + (o.value || 0));
  lyOrd.forEach(o => lyBy[o.accountId] = (lyBy[o.accountId] || 0) + (o.value || 0));
  const retained = Object.keys(tyBy).filter(id => lyBy[id]);
  const rTy = retained.reduce((n, id) => n + tyBy[id], 0);
  const rLy = retained.reduce((n, id) => n + lyBy[id], 0);
  const sssgSales = rLy ? rTy / rLy - 1 : null;
  const lyCount = Object.keys(lyBy).length;
  const sssgAcc = lyCount ? retained.length / lyCount - 1 : null;
  const lost = Object.keys(lyBy).filter(id => !tyBy[id]);
  const won = Object.keys(tyBy).filter(id => !lyBy[id]);

  const pct = x => x == null ? '—' : (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + '%';
  const tone = a => a >= 1 ? '--ok' : a >= 0.8 ? '--warn' : '--bad';

  // ---- stage funnel: magnitude, so one hue light->dark -------------------
  const stageRows = [0,1,2,3,4].map(i => {
    const rows = open.filter(o => o.stage === i);
    return { i, k: STAGES[i].k, n: rows.length,
             v: rows.reduce((n, o) => n + (o.expectedValue || 0), 0) };
  });
  const maxV = Math.max(1, ...stageRows.map(r => r.v));
  const funnel = stageRows.map(r => {
    const w = Math.max(r.v ? 2 : 0, r.v / maxV * 100);
    // light -> dark with depth in the pipeline
    const l = 78 - (r.i / 4) * 34;
    return `<button class="fnrow" data-stage="${r.i}">
      <span class="fnk">${ab(r.k)}</span>
      <span class="fnbar"><span class="fnfill"
        style="width:${w}%;background:hsl(340 55% ${l}%)"></span></span>
      <span class="fnn">${r.n}</span>
      <span class="fnv">${inr(r.v)}</span>
    </button>`;
  }).join('');

  // ---- per rep ------------------------------------------------------------
  const perRep = uids.map(id => {
    const mine = ord.filter(o => o.bookedBy === id);
    const v = mine.reduce((n, o) => n + (o.value || 0), 0);
    const t = targetForRange(from, to, [id]);
    return { id, name: userName(id), v, t, a: t ? v / t : 0, n: mine.length };
  }).filter(r => r.v || r.t).sort((x, y) => y.v - x.v);

  const unowned = ord.filter(o => !o.bookedBy);
  const unownedVal = unowned.reduce((n, o) => n + (o.value || 0), 0);

  $('#view').innerHTML = `
    <div class="grid2" style="margin-bottom:14px">
      ${tile('Net sales', inr(net),
             `${ord.length} orders · ${accountsBilled} accounts`)}
      ${tile('Target for this range', inr(tgt),
             tgt ? `${inr(Math.abs(net - tgt))} ${net >= tgt ? 'ahead' : 'short'}`
                 : 'no target set')}
      ${tile('Achievement', tgt ? (ach * 100).toFixed(0) + '%' : '—',
             'of the target for this range', tone(ach))}
      ${tile('vs last year', pct(growth), lyNet ? inr(lyNet) + ' then' : 'no orders a year ago',
             growth == null ? null : (growth >= 0 ? '--ok' : '--bad'))}
    </div>

    <div class="card">
      <h2>Open pipeline · ${open.length} deals</h2>
      <div class="grid2" style="margin-bottom:12px">
        ${tile('Pipeline value', inr(openVal), 'sum of expected values')}
        ${tile('Weighted', inr(weighted), 'by stage probability')}
      </div>
      <div class="funnel">${funnel}</div>
      <p class="hint" style="margin-top:10px">Tap a stage to see its deals.
        ${ab('C4')} and cancelled are excluded — this is what is still open.
        Deals with no owner are not counted against anyone, so they are not
        here either.</p>
    </div>

    <div class="card">
      <h2>Same-client growth · ${ab('SSSG')}</h2>
      <div class="row" style="margin-bottom:12px">
        <button class="chip sssg on" data-b="sales">By sales</button>
        <button class="chip sssg" data-b="acc">By account count</button>
      </div>
      <div id="sssgBody"></div>
    </div>

    <div class="card">
      <h2>New and old clients</h2>
      <div class="splitbar">
        <span style="width:${net ? newRev / net * 100 : 50}%;background:hsl(340 55% 62%)"></span>
        <span style="width:${net ? oldRev / net * 100 : 50}%;background:hsl(340 40% 82%)"></span>
      </div>
      <div class="row sm" style="margin-top:8px">
        <div><b>${inr(newRev)}</b> new client
          <span class="muted">· ${net ? (newRev/net*100).toFixed(0) : 0}%</span></div>
        <div style="text-align:right"><b>${inr(oldRev)}</b> old client
          <span class="muted">· ${net ? (oldRev/net*100).toFixed(0) : 0}%</span></div>
      </div>
      <p class="hint" style="margin-top:10px">Old means the account ordered before
        this financial year. It decides the incentive rate, so it is worth a look.</p>
    </div>

    <div class="card">
      <h2>By rep</h2>
      <div class="list">
        ${perRep.length ? perRep.map(r => `
          <div class="it" style="cursor:default;align-items:flex-start;
               flex-direction:column;gap:6px">
            <div style="display:flex;width:100%;gap:10px;align-items:baseline">
              <span class="nm">${esc(r.name)}</span>
              <span class="meta">${inr(r.v)} of ${inr(r.t)} · ${r.n} orders</span>
            </div>
            <div class="meter"><span style="width:${Math.min(100, r.a*100)}%;
              background:var(${tone(r.a)})"></span></div>
            <div class="sm" style="color:var(${tone(r.a)});font-weight:650">
              ${r.t ? (r.a*100).toFixed(0) + '%' : 'no target'}</div>
          </div>`).join('')
        : '<div class="empty">Nothing booked in this range.</div>'}
      </div>
      ${unowned.length ? `<p class="hint" style="margin-top:10px">
        <b>${inr(unownedVal)}</b> across ${unowned.length} order${unowned.length>1?'s':''}
        has no rep attached, so it counts toward nobody's target.</p>` : ''}
    </div>`;

  // SSSG toggle
  const drawSssg = (basis) => {
    const body = $('#sssgBody');
    if (!lyCount) {
      body.innerHTML = `<div class="empty">No orders in the same window last year,
        so there is nothing to compare.</div>`;
      return;
    }
    if (basis === 'sales') {
      body.innerHTML = `
        <div class="grid2">
          ${tile('SSSG by sales', pct(sssgSales),
                 `${retained.length} clients bought in both windows`,
                 sssgSales == null ? null : (sssgSales >= 0 ? '--ok' : '--bad'))}
          ${tile('Retained this year', inr(rTy), `${inr(rLy)} from them last year`)}
        </div>
        <div class="bridge">
          <div><span class="muted">Last year</span><b>${inr(lyNet)}</b></div>
          <div><span class="muted">− Lost clients</span>
            <b style="color:var(--bad)">${inr(lyNet - rLy)}</b></div>
          <div><span class="muted">± Same clients</span>
            <b style="color:var(${rTy >= rLy ? '--ok' : '--bad'})">${
              (rTy >= rLy ? '+' : '−') + inr(Math.abs(rTy - rLy)).slice(1)}</b></div>
          <div><span class="muted">+ New clients</span>
            <b style="color:var(--ok)">${inr(net - rTy)}</b></div>
          <div><span class="muted">This year</span><b>${inr(net)}</b></div>
        </div>
        <p class="hint" style="margin-top:10px">Reads left to right: last year's
          total, less what walked away, plus or minus how the clients who stayed
          moved, plus what came in new.</p>`;
    } else {
      body.innerHTML = `
        <div class="grid2">
          ${tile('SSSG by accounts', pct(sssgAcc),
                 `${retained.length} of ${lyCount} last-year clients came back`,
                 sssgAcc == null ? null : (sssgAcc >= 0 ? '--ok' : '--bad'))}
          ${tile('Lost clients', String(lost.length),
                 'bought last year, not this')}
        </div>
        <div class="bridge">
          <div><span class="muted">Last year</span><b>${lyCount}</b></div>
          <div><span class="muted">Retained</span><b>${retained.length}</b></div>
          <div><span class="muted">+ New</span>
            <b style="color:var(--ok)">${won.length}</b></div>
          <div><span class="muted">− Lost</span>
            <b style="color:var(--bad)">${lost.length}</b></div>
          <div><span class="muted">This year</span><b>${Object.keys(tyBy).length}</b></div>
        </div>`;
    }
  };
  drawSssg('sales');
  $('#view').querySelectorAll('.sssg').forEach(b => b.onclick = () => {
    $('#view').querySelectorAll('.sssg').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    drawSssg(b.dataset.b);
  });

  // a stage opens its deals
  $('#view').querySelectorAll('[data-stage]').forEach(b => b.onclick = () => {
    const i = +b.dataset.stage;
    const rows = open.filter(o => o.stage === i)
      .sort((x, y) => (y.expectedValue || 0) - (x.expectedValue || 0));
    modal(STAGES[i].k + ' · ' + STAGES[i].n, rows.length
      ? `<div class="list">` + rows.slice(0, 60).map(o => {
          const a = S.byId[o.accountId] || {};
          const na = o.nextActionDate ? iso(parseDate(o.nextActionDate)) : null;
          return `<div class="it" data-go="${o.accountId}">
            <span class="nm">${esc(a.name || o.name || 'Account')}</span>
            <span class="meta">${inr(o.expectedValue || 0)} · ${
              na ? esc(na) : '<span class="req">' + ab('NA') + '</span>'}</span>
          </div>`;
        }).join('') + `</div>`
        + (rows.length > 60 ? `<p class="hint" style="margin-top:8px">
             Showing the 60 largest of ${rows.length}.</p>` : '')
      : `<div class="empty">Nothing at this stage.</div>`,
      m => { m.querySelectorAll('[data-go]').forEach(el => el.onclick = () => {
        closeModal(); go('log'); setTimeout(() => pick(el.dataset.go), 60);
      }); return null; });
  });
}

/* ==================================================================== ADMIN
   Targets, editable. Until now the workbook was the only way to change one,
   which meant a re-run of the whole seed to move a single number.

   Document ids are predictable - tgt_<userId>_<month>_<bucket> - so a target
   edited here and a target loaded from the workbook are the SAME document.
   Were the id a hash, as it was at first, the browser could not reproduce it
   (no md5) and the two would sit side by side with the later load winning
   silently. */

const NEW_SHARE = 0.45;   // every one of the 52 rep-months in the sheet splits
const OLD_SHARE = 0.55;   // exactly 45/55, so that is the default here too

const fyMonths = (startYear) => {
  const out = [];
  for (let i = 0; i < 12; i++) {
    const m = (3 + i) % 12, y = startYear + (3 + i > 11 ? 1 : 0);
    out.push(`${y}-${String(m + 1).padStart(2, '0')}`);
  }
  return out;
};
const monthLabel = mk => {
  const [y, m] = mk.split('-').map(Number);
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]
    + '-' + String(y).slice(2);
};

function viewAdmin() {
  const reps = S.users.filter(u => u.active !== false && u.role !== 'admin');
  const sel = S.adminRep || (reps[0] && reps[0].id);
  S.adminRep = sel;

  $('#view').innerHTML = `
    <div class="card">
      <h2>Targets</h2>
      <div class="row" style="margin-bottom:12px">
        <div><label for="arep">Whose targets</label>
          <select id="arep" class="fld">
            ${reps.map(u => `<option value="${u.id}"${u.id===sel?' selected':''}>
              ${esc(u.name)}</option>`).join('')}
          </select></div>
        <div><label for="afy">Financial year</label>
          <select id="afy" class="fld">
            <option value="2026">FY27 · Apr-26 to Mar-27</option>
            <option value="2025">FY26 · Apr-25 to Mar-26</option>
          </select></div>
      </div>
      <div id="tgtBody"></div>
    </div>`;

  const draw = () => {
    const uid = $('#arep').value, fy = +$('#afy').value;
    const months = fyMonths(fy);
    const cur = {};
    S.targets.filter(t => t.scope === 'rep' && t.userId === uid)
      .forEach(t => { (cur[t.month] = cur[t.month] || {})[t.bucket] = t.amount; });

    $('#tgtBody').innerHTML = `
      <p class="hint">Type the overall figure and the split follows at
        45 / 55, which is how every month in the workbook is set. Override
        either side if you need to.</p>
      <div class="tgrid">
        <div class="th">Month</div><div class="th">Overall</div>
        <div class="th">New</div><div class="th">Old</div>
        ${months.map(m => {
          const c = cur[m] || {};
          return `<div class="tm">${monthLabel(m)}</div>
            <div><input class="fld tin" data-m="${m}" data-b="overall" inputmode="numeric"
              value="${c.overall ? Math.round(c.overall) : ''}" placeholder="0"></div>
            <div><input class="fld tin" data-m="${m}" data-b="new" inputmode="numeric"
              value="${c.new ? Math.round(c.new) : ''}" placeholder="0"></div>
            <div><input class="fld tin" data-m="${m}" data-b="old" inputmode="numeric"
              value="${c.old ? Math.round(c.old) : ''}" placeholder="0"></div>`;
        }).join('')}
      </div>
      <div class="row" style="margin-top:14px;align-items:center">
        <div class="sm"><b id="tgtSum">—</b> <span class="muted">for the year</span></div>
        <div style="flex:0 0 auto"><button class="btn" id="tgtSave"
          style="width:auto;padding:10px 18px">Save targets</button></div>
      </div>
      <p id="tgtMsg" class="msg"></p>`;

    const inputs = () => [...$('#tgtBody').querySelectorAll('.tin')];
    const retotal = () => {
      const n = inputs().filter(i => i.dataset.b === 'overall')
        .reduce((a, i) => a + (Number(digits(i.value)) || 0), 0);
      $('#tgtSum').textContent = inr(n);
    };

    inputs().forEach(i => {
      i.oninput = () => {
        if (i.dataset.b === 'overall') {
          const v = Number(digits(i.value)) || 0;
          const row = inputs().filter(x => x.dataset.m === i.dataset.m);
          const nw = row.find(x => x.dataset.b === 'new');
          const od = row.find(x => x.dataset.b === 'old');
          // Rounded so the two halves always add back to the whole.
          if (nw) nw.value = v ? Math.round(v * NEW_SHARE) : '';
          if (od) od.value = v ? v - Math.round(v * NEW_SHARE) : '';
        }
        retotal();
      };
    });
    retotal();

    $('#tgtSave').onclick = async () => {
      const b = $('#tgtSave');
      const rows = [];
      months.forEach(m => {
        ['overall','new','old'].forEach(bucket => {
          const el = inputs().find(x => x.dataset.m === m && x.dataset.b === bucket);
          rows.push({ m, bucket, amount: Number(digits(el.value)) || 0 });
        });
      });
      // A month whose halves do not add up is almost always a typo, and it
      // would quietly skew that person's incentive gates for the year.
      const bad = months.filter(m => {
        const g = k => rows.find(r => r.m === m && r.bucket === k).amount;
        return g('overall') && Math.abs(g('new') + g('old') - g('overall')) > 2;
      });
      if (bad.length) {
        msg('tgtMsg', 'New and old do not add up to overall in '
          + bad.map(monthLabel).join(', ') + '. Fix those before saving.');
        return;
      }

      busy(b, 'Saving…');
      try {
        const batch = writeBatch(db);
        rows.forEach(r => {
          const id = `tgt_${uid}_${r.m}_${r.bucket}`;
          batch.set(doc(db, 'targets', id), {
            userId: uid, month: r.m, bucket: r.bucket,
            amount: r.amount, scope: 'rep', accountName: null,
            updatedAt: serverTimestamp(), updatedBy: S.me.id
          }, { merge: true });
        });
        await batch.commit();

        // keep the local copy honest so the dashboard reflects it at once
        rows.forEach(r => {
          const id = `tgt_${uid}_${r.m}_${r.bucket}`;
          const ex = S.targets.find(t => t.id === id);
          if (ex) ex.amount = r.amount;
          else S.targets.push({ id, userId: uid, month: r.m, bucket: r.bucket,
                                amount: r.amount, scope: 'rep', accountName: null });
        });
        msg('tgtMsg', 'Saved. The dashboard uses these straight away.', 'ok');
      } catch (e) {
        msg('tgtMsg', friendly(e, 'Could not save the targets.'));
      } finally { done(b); }
    };
  };

  $('#arep').onchange = draw;
  $('#afy').onchange = draw;
  draw();
}
